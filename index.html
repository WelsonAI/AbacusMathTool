<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Soroban Tool EN ZH BM</title>
  <style>
    :root {
      /* #FFCA4F mixed with white for a softer, child-friendly background. */
      --page-yellow: #ffe7b0;
      --sunny-yellow: #ffca4f;
      --ink: #3f321e;
      --card: rgba(255, 255, 255, .72);
      --card-border: rgba(128, 83, 16, .14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100dvh;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, .72) 0 5px, transparent 6px),
        radial-gradient(circle at 86% 18%, rgba(255, 255, 255, .5) 0 4px, transparent 5px),
        linear-gradient(180deg, #fff3d4 0%, var(--page-yellow) 62%, #ffdda0 100%);
      background-size: 160px 160px, 210px 210px, auto;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      color: var(--ink);
      isolation: isolate;
    }

    .tool {
      position: relative;
      z-index: 2;
      width: min(96vw, 760px);
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      padding: 18px 10px clamp(110px, 14vh, 150px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .top-panel {
      position: relative;
      width: 100%;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 14px 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(119, 76, 13, .12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .display {
      width: 100%;
      padding: 0 6px;
      color: #222;
      line-height: 1.1;
    }

    .number-line {
      font-size: clamp(40px, 8vw, 68px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 3px;
      color: #5a3d16;
    }

    .number-line.hidden {
      display: none;
    }

    .word-line {
      margin-top: 7px;
      min-height: 28px;
      font-size: clamp(18px, 2.8vw, 25px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .3px;
      overflow-wrap: anywhere;
    }

    .word-line.hidden {
      display: none;
    }

    .lang-switch {
      position: static;
      right: auto;
      top: auto;
      display: flex;
      gap: 5px;
      z-index: 100;
      background: #ffffff;
      padding: 5px;
      border-radius: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      margin: 0 auto;
    }

    .lang-select {
      appearance: none;
      -webkit-appearance: none;
      min-width: 145px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid #222;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      padding: 5px 30px 5px 10px;
      background-image:
        linear-gradient(45deg, transparent 50%, #222 50%),
        linear-gradient(135deg, #222 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 14px,
        calc(100% - 10px) 14px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .lang-select:focus {
      outline: 3px solid rgba(0,0,0,.14);
      outline-offset: 2px;
    }

    .bead-sound-toggle {
      min-width: 108px;
      height: 34px;
      padding: 4px 9px;
      border: 2px solid #222;
      border-radius: 10px;
      background: #fff;
      color: #111;
      box-shadow: none;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .bead-sound-toggle[aria-pressed="false"] {
      color: #695b48;
      background: #eee9df;
    }

    .answer-btn {
      min-width: 66px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid #222;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      padding: 5px 8px;
    }

    .answer-btn:active {
      transform: scale(.98);
    }

    .speak-btn {
      min-width: 42px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid #222;
      background: #fff;
      color: #111;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      padding: 5px 8px;
    }

    .speak-btn:active {
      transform: scale(.98);
    }

    .speak-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .answer-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .number-input-panel {
      width: min(100%, 700px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 auto 10px;
      padding: 8px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    .input-label {
      font-size: 15px;
      font-weight: 900;
      color: #222;
    }

    .number-input {
      width: 140px;
      height: 36px;
      border-radius: 10px;
      border: 2px solid #222;
      padding: 5px 10px;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      color: #111;
      background: #fff;
    }

    .show-number-btn,
    .reset-btn {
      min-width: 70px;
      height: 36px;
      border-radius: 10px;
      border: 2px solid #222;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      padding: 5px 10px;
      box-shadow: none;
    }

    .input-error {
      flex-basis: 100%;
      min-height: 18px;
      line-height: 1.2;
      color: #b00020;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .input-error.hidden {
      display: none;
    }


    .abacus-wrap {
      position: relative;
      width: min(100%, 700px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      user-select: none;
      touch-action: none;
    }

    .abacus-wrap::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 8% 15.2% 8.5%;
      border-radius: 5px;
      background: rgba(255, 249, 230, .78);
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
    }

    .rod-label {
      position: absolute;
      bottom: 4.8%;
      transform: translateX(-50%);
      z-index: 8;

      /* Smaller and consistent for EN labels: thousand / hundred / ten / one */
      font-size: clamp(10px, 1.6vw, 15px);
      font-weight: 900;
      color: #222;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(77, 49, 8, .12);
      border-radius: 8px;
      padding: 2px 4px;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .rod-label.is-active {
      transform: translateX(-50%) scale(1.1);
      background: #ffca4f;
      box-shadow: 0 0 0 4px rgba(255, 202, 79, .25);
    }

    .rod-label.hidden {
      display: none;
    }

    .bead {
      position: absolute;
      width: 10.5%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      user-select: none;
      z-index: 4;
      filter: drop-shadow(0 4px 3px rgba(73, 37, 6, .24));
      transition:
        top 155ms cubic-bezier(.22, 1, .36, 1),
        transform 100ms ease,
        filter 100ms ease;
      will-change: top, transform;
    }

    .bead:active {
      cursor: grabbing;
      z-index: 20;
    }

    .bead.is-dragging {
      transform: translate(-50%, -50%) scale(1.07);
      filter: drop-shadow(0 7px 5px rgba(73, 37, 6, .3));
      transition-duration: 85ms, 100ms, 100ms;
    }

    .bead.is-settling {
      animation: bead-settle 190ms cubic-bezier(.2, .9, .35, 1.25);
    }

    .abacus-wrap.is-animating .bead {
      pointer-events: none;
    }

    .rod-focus {
      position: absolute;
      z-index: 2;
      top: 7.5%;
      bottom: 8%;
      width: 12%;
      transform: translateX(-50%) scaleX(.65);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 202, 79, 0), rgba(255, 202, 79, .34), rgba(255, 202, 79, 0));
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 170ms ease;
    }

    .rod-focus.is-active {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    @keyframes bead-settle {
      0% { transform: translate(-50%, -50%) scale(1); }
      48% { transform: translate(-50%, -50%) scale(1.09, .94); }
      76% { transform: translate(-50%, -50%) scale(.98, 1.03); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .forest-footer {
      position: fixed;
      z-index: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(130px, 22vw, 270px);
      overflow: hidden;
      pointer-events: none;
    }

    .forest-footer img {
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: max(100%, 900px);
      height: 100%;
      object-fit: fill;
      transform: translateX(-50%);
      filter: saturate(1.25) brightness(1.28);
      opacity: .98;
    }

    button {
      font-size: 18px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 12px;
      border: 2px solid #5f431c;
      background: #fffdf7;
      color: #3f321e;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(95, 67, 28, .22), 0 7px 18px rgba(95, 67, 28, .11);
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    button:hover:not(:disabled) {
      background: #fff8e7;
    }

    button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(95, 67, 28, .22), 0 3px 9px rgba(95, 67, 28, .12);
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(255, 151, 54, .42);
      outline-offset: 3px;
    }

    button:disabled,
    select:disabled,
    input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* Keep the complete tool inside common laptop-height viewports. */
    @media (max-height: 1024px) and (min-width: 641px) {
      .tool {
        padding: 8px 10px 96px;
      }

      .top-panel {
        min-height: 210px;
        margin-bottom: 6px;
        padding: 8px 12px;
      }

      .number-input-panel {
        margin-bottom: 6px;
      }

      .abacus-wrap {
        width: min(100%, 700px, calc(133.333dvh - 504px));
      }
    }

    @media (max-width: 640px) {
      .tool {
        width: 100%;
        padding: 10px 8px 145px;
      }

      .top-panel {
        min-height: 138px;
        margin-bottom: 4px;
        padding: 10px 8px;
        border-radius: 20px;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }

      .display {
        padding: 0 6px;
      }

      .number-line {
        font-size: clamp(38px, 12vw, 58px);
      }

      .word-line {
        font-size: clamp(17px, 5vw, 22px);
        min-height: 24px;
      }

      /*
        Mobile fix:
        Put EN / ZH / BM above the number instead of floating over it.
      */
      .lang-switch {
        position: static;
        right: auto;
        top: auto;
        order: -1;
        margin: 0 auto;
        gap: 4px;
        padding: 4px;
      }

      .lang-select {
        min-width: 140px;
        height: 31px;
        font-size: 13px;
        padding-top: 5px;
        padding-bottom: 5px;
        background-position:
          calc(100% - 16px) 13px,
          calc(100% - 10px) 13px;
      }

      .bead-sound-toggle {
        min-width: 96px;
        height: 31px;
        padding: 4px 7px;
        font-size: 12px;
      }

      .answer-btn {
        min-width: 58px;
        height: 31px;
        font-size: 13px;
        padding: 5px 7px;
      }

      .speak-btn {
        min-width: 38px;
        height: 31px;
        font-size: 14px;
        padding: 5px 8px;
      }

      .number-input-panel {
        width: min(92vw, 520px);
        margin-bottom: 8px;
        padding: 7px;
        gap: 6px;
      }

      .number-input {
        width: 120px;
        height: 34px;
        font-size: 15px;
      }

      .show-number-btn,
      .reset-btn {
        height: 34px;
        font-size: 13px;
      }

      .abacus-wrap {
        width: min(92vw, 520px);
      }

      .forest-footer {
        height: 135px;
      }

      .forest-footer img {
        width: 900px;
      }

      .rod-label {
        bottom: 4.4%;

        /* Smaller and consistent on mobile */
        font-size: clamp(9px, 2.6vw, 12px);
        padding: 1px 3px;
        line-height: 1;
      }
    }

    /* Very short landscape windows genuinely need scrolling to avoid clipping. */
    @media (max-height: 640px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-y: auto;
        overscroll-behavior: auto;
      }

      .tool {
        height: auto;
        min-height: 640px;
        padding-bottom: 110px;
        overflow: visible;
      }

      .abacus-wrap {
        width: min(92vw, 520px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bead,
      button {
        transition: none;
      }

      .bead.is-settling {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="tool">
    <section class="top-panel">
      <div class="lang-switch" aria-label="Language switch">
        <select class="lang-select" id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="bm">Bahasa Melayu</option>
        </select>
        <button class="bead-sound-toggle" id="beadSoundToggle" type="button" aria-pressed="true">
          🔊 Beads: On
        </button>
      </div>

      <div class="display">
        <div class="number-line hidden" id="numberDisplay">0</div>
        <div class="word-line hidden" id="wordDisplay"></div>
      </div>

      <div class="answer-controls" aria-label="Answer controls">
        <button class="answer-btn" id="answerBtn" type="button" aria-label="Show answer">Answer</button>
        <button class="speak-btn" id="speakBtn" type="button" aria-label="Speak">🔊</button>
      </div>
    </section>

    <section class="number-input-panel" aria-label="Number input">
      <span class="input-label" id="keyNumberLabel">Number</span>
      <input class="number-input" id="keyNumberInput" type="number" inputmode="numeric" min="0" max="9999" placeholder="0" />
      <button class="show-number-btn" id="showNumberBtn" type="button">Show</button>
      <button class="reset-btn" id="resetBtn" type="button">Reset</button>
      <div class="input-error hidden" id="inputError" role="alert"></div>
    </section>

    <div class="abacus-wrap" id="abacus">
      <div class="rod-focus" data-focus-col="0"></div>
      <div class="rod-focus" data-focus-col="1"></div>
      <div class="rod-focus" data-focus-col="2"></div>
      <div class="rod-focus" data-focus-col="3"></div>

      <img class="frame" src="assets/frame.png" alt="Soroban frame" />

      <div class="rod-label hidden" data-label-col="0"></div>
      <div class="rod-label hidden" data-label-col="1"></div>
      <div class="rod-label hidden" data-label-col="2"></div>
      <div class="rod-label hidden" data-label-col="3"></div>
    </div>
  </main>

  <div class="forest-footer" aria-hidden="true">
    <img src="assets/forest-footer.png" alt="" />
  </div>

  <script>
    const abacus = document.getElementById("abacus");
    const numberDisplay = document.getElementById("numberDisplay");
    const wordDisplay = document.getElementById("wordDisplay");
    const resetBtn = document.getElementById("resetBtn");
    const speakBtn = document.getElementById("speakBtn");
    const answerBtn = document.getElementById("answerBtn");
    const languageSelect = document.getElementById("languageSelect");
    const beadSoundToggle = document.getElementById("beadSoundToggle");
    const keyNumberLabel = document.getElementById("keyNumberLabel");
    const keyNumberInput = document.getElementById("keyNumberInput");
    const showNumberBtn = document.getElementById("showNumberBtn");
    const inputError = document.getElementById("inputError");
    const rodLabels = document.querySelectorAll(".rod-label");
    const rodFocuses = document.querySelectorAll(".rod-focus");

    // Rod centers tuned to the current 2D frame
    const columns = [
      { place: 1000, x: 29.15, upper: false, lower: 0 },
      { place: 100,  x: 43.10, upper: false, lower: 0 },
      { place: 10,   x: 56.95, upper: false, lower: 0 },
      { place: 1,    x: 70.75, upper: false, lower: 0 }
    ];

    const languageData = {
      en: {
        labels: ["thousand", "hundred", "ten", "one"],
        showLabels: true,
        words: numberToEnglish,
        speechLang: "en-US"
      },
      zh: {
        labels: ["千", "百", "十", "个"],
        showLabels: true,
        words: numberToChinese,
        speechLang: "zh-CN"
      },
      bm: {
        labels: ["ribu", "ratus", "puluh", "sa"],
        showLabels: true,
        words: numberToMalay,
        speechLang: "ms-MY"
      }
    };

    const buttonTextData = {
      en: {
        answer: "Answer",
        reset: "Reset",
        number: "Number",
        show: "Show",
        soundOn: "Beads: On",
        soundOff: "Beads: Off",
        error: "Please enter a number from 0 to 9999."
      },
      zh: {
        answer: "答案",
        reset: "重置",
        number: "数字",
        show: "显示",
        soundOn: "珠声：开",
        soundOff: "珠声：关",
        error: "请输入 0 到 9999 的数字。"
      },
      bm: {
        answer: "Jawapan",
        reset: "Mula Semula",
        number: "Nombor",
        show: "Papar",
        soundOn: "Bunyi: Hidup",
        soundOff: "Bunyi: Mati",
        error: "Sila masukkan nombor dari 0 hingga 9999."
      }
    };

    let currentLang = "en";
    let answerVisible = false;
    let beadSequenceToken = 0;
    let controlsLocked = false;
    let activeColumnToken = 0;

    /*
      Label position fine tuning only.
      This will NOT move the abacus beads.

      Order:
      [thousand, hundred, ten, one]

      Positive number = move right
      Negative number = move left

      Your current mobile issue:
      hundred is moved slightly right by 1.2%.
    */
    const labelOffsetPc = [0, 0, 0, 0];
    const labelOffsetMobile = [0, 1.2, 0, 0];

    function updateLabelPositions() {
      const isMobile = window.matchMedia("(max-width: 640px)").matches;

      rodLabels.forEach(label => {
        const colIndex = Number(label.dataset.labelCol);
        const offset = isMobile ? labelOffsetMobile[colIndex] : labelOffsetPc[colIndex];
        label.style.left = (columns[colIndex].x + offset) + "%";
      });

      rodFocuses.forEach(focus => {
        const colIndex = Number(focus.dataset.focusCol);
        focus.style.left = columns[colIndex].x + "%";
      });
    }

    updateLabelPositions();
    window.addEventListener("resize", updateLabelPositions);

    languageSelect.addEventListener("change", () => {
      setLanguage(languageSelect.value);
    });

    function setLanguage(lang) {
      currentLang = lang;
      stopMalayAudio();

      languageSelect.value = lang;

      const data = languageData[lang];
      const buttonText = buttonTextData[lang];

      answerBtn.textContent = buttonText.answer;
      answerBtn.setAttribute("aria-label", buttonText.answer);
      resetBtn.textContent = buttonText.reset;
      keyNumberLabel.textContent = buttonText.number;
      showNumberBtn.textContent = buttonText.show;
      updateBeadSoundToggle();
      updateInputErrorMessage();

      rodLabels.forEach((label, index) => {
        label.textContent = data.labels[index];
        label.classList.toggle("hidden", !data.showLabels);
      });

      hideAnswer();
      updateNumber();
    }

    let currentInputError = false;

    function showInputError() {
      currentInputError = true;
      inputError.textContent = buttonTextData[currentLang].error;
      inputError.classList.remove("hidden");
    }

    function clearInputError() {
      currentInputError = false;
      inputError.textContent = "";
      inputError.classList.add("hidden");
    }

    function updateInputErrorMessage() {
      if (currentInputError) inputError.textContent = buttonTextData[currentLang].error;
    }

    function getKeyInputNumber() {
      const value = Number(keyNumberInput.value);
      if (!Number.isFinite(value)) return null;
      const number = Math.floor(value);
      if (number < 0 || number > 9999) return null;
      return number;
    }

    async function showNumberOnAbacus() {
      const number = getKeyInputNumber();
      if (number === null) {
        showInputError();
        return;
      }

      clearInputError();
      stopMalayAudio();
      hideAnswer();
      await animateAbacusNumber(number, [0, 1, 2, 3]);
    }

    function getDigits(number) {
      return [
        Math.floor(number / 1000) % 10,
        Math.floor(number / 100) % 10,
        Math.floor(number / 10) % 10,
        number % 10
      ];
    }

    function getColumnDigit(colIndex) {
      const col = columns[colIndex];
      return (col.upper ? 5 : 0) + col.lower;
    }

    function setColumnDigit(colIndex, digit) {
      columns[colIndex].upper = digit >= 5;
      columns[colIndex].lower = digit % 5;
    }

    function setAbacusNumberInstant(number) {
      getDigits(number).forEach((digit, index) => setColumnDigit(index, digit));
      syncBeadPositions();
      updateNumber();
    }

    async function animateAbacusNumber(number, order) {
      const digits = getDigits(number);
      const token = ++beadSequenceToken;
      setControlsLocked(true);

      try {
        for (const colIndex of order) {
          if (token !== beadSequenceToken) return;
          if (getColumnDigit(colIndex) === digits[colIndex]) continue;

          setColumnDigit(colIndex, digits[colIndex]);
          syncBeadPositions();
          settleColumn(colIndex);
          highlightColumn(colIndex, 230);
          playBeadClick(.92, true);
          updateNumber();
          await wait(135);
        }
      } finally {
        if (token === beadSequenceToken) {
          setControlsLocked(false);
          clearActiveColumn(180);
          updateNumber();
        }
      }
    }

    function setControlsLocked(locked) {
      controlsLocked = locked;
      showNumberBtn.disabled = locked;
      resetBtn.disabled = locked;
      answerBtn.disabled = locked;
      languageSelect.disabled = locked;
      keyNumberInput.disabled = locked;
      abacus.classList.toggle("is-animating", locked);
    }

    showNumberBtn.addEventListener("click", showNumberOnAbacus);
    keyNumberInput.addEventListener("keydown", event => {
      if (event.key === "Enter") showNumberOnAbacus();
    });

    // Upper bead:
    // - higher at rest
    // - active position lowered so it touches the middle beam from above
    const upperY = {
      inactive: 14.8,
      active: 28.5
    };

    // Lower beads:
    // - active positions rise up close to the middle beam
    // - inactive positions sit lower but still close together
    // - bottom bead stays inside the frame
    const lowerActiveY = [42.5, 50.3, 58.1, 65.9];
    const lowerInactiveY = [58.6, 66.4, 74.2, 82.0];

    const beads = [];
    let dragging = null;
    let beadAudioContext = null;
    let beadSoundBuffer = null;
    let beadSoundDecodePromise = null;
    let lastBeadSoundAt = 0;
    let beadSoundEnabled = readBeadSoundPreference();

    const beadSoundDataPromise = fetch("assets/audio/bead/abacus-cc-by.mp3")
      .then(response => {
        if (!response.ok) throw new Error(`Bead sound HTTP ${response.status}`);
        return response.arrayBuffer();
      })
      .catch(error => {
        console.warn("Real bead sound could not be loaded; using synthesized fallback.", error);
        return null;
      });

    function readBeadSoundPreference() {
      try {
        return localStorage.getItem("abacus-bead-sound") !== "off";
      } catch {
        return true;
      }
    }

    function saveBeadSoundPreference() {
      try {
        localStorage.setItem("abacus-bead-sound", beadSoundEnabled ? "on" : "off");
      } catch {
        // The sound still works when storage is unavailable.
      }
    }

    function updateBeadSoundToggle() {
      if (!beadSoundToggle) return;
      const text = buttonTextData[currentLang];
      beadSoundToggle.setAttribute("aria-pressed", String(beadSoundEnabled));
      beadSoundToggle.textContent = `${beadSoundEnabled ? "🔊" : "🔇"} ${beadSoundEnabled ? text.soundOn : text.soundOff}`;
      beadSoundToggle.setAttribute("aria-label", beadSoundEnabled ? text.soundOn : text.soundOff);
    }

    beadSoundToggle.addEventListener("click", () => {
      beadSoundEnabled = !beadSoundEnabled;
      saveBeadSoundPreference();
      updateBeadSoundToggle();
      if (beadSoundEnabled) playBeadClick(.85, true);
    });

    function unlockBeadSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return Promise.resolve(null);

      if (!beadAudioContext) beadAudioContext = new AudioContextClass();
      if (beadAudioContext.state === "suspended") {
        return beadAudioContext.resume()
          .then(() => beadAudioContext)
          .catch(() => null);
      }

      return Promise.resolve(beadAudioContext);
    }

    async function loadBeadSoundBuffer(context) {
      if (beadSoundBuffer) return beadSoundBuffer;
      if (!beadSoundDecodePromise) {
        beadSoundDecodePromise = beadSoundDataPromise.then(data => {
          if (!data) return null;
          return context.decodeAudioData(data.slice(0));
        }).then(buffer => {
          beadSoundBuffer = buffer;
          return buffer;
        }).catch(error => {
          console.warn("Real bead sound could not be decoded; using synthesized fallback.", error);
          return null;
        });
      }
      return beadSoundDecodePromise;
    }

    // Play a short excerpt from a real abacus recording. A small pitch change
    // prevents repeated movements from sounding mechanically identical.
    function playBeadClick(strength = 1, force = false) {
      if (!beadSoundEnabled) return;
      const nowMs = performance.now();
      if (!force && nowMs - lastBeadSoundAt < 38) return;
      lastBeadSoundAt = nowMs;

      unlockBeadSound().then(async context => {
        if (!context || context.state !== "running") return;

        const recordedSound = await loadBeadSoundBuffer(context);
        if (recordedSound) {
          const source = context.createBufferSource();
          const gain = context.createGain();
          source.buffer = recordedSound;
          source.playbackRate.value = 0.96 + Math.random() * 0.08;
          gain.gain.value = 1.8 * strength;
          source.connect(gain).connect(context.destination);
          source.start(context.currentTime, 2.73, .27);
          return;
        }

        playSynthesizedBeadClick(context, strength);
      });
    }

    function playSynthesizedBeadClick(context, strength) {
      const now = context.currentTime;
      const duration = 0.075;
      const master = context.createGain();
      master.gain.setValueAtTime(0.3 * strength, now);
      master.gain.exponentialRampToValueAtTime(0.001, now + duration);
      master.connect(context.destination);

      const buffer = context.createBuffer(1, Math.ceil(context.sampleRate * duration), context.sampleRate);
      const samples = buffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) {
        const fade = 1 - (i / samples.length);
        samples[i] = (Math.random() * 2 - 1) * fade * fade * fade;
      }

      const noise = context.createBufferSource();
      const filter = context.createBiquadFilter();
      noise.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.value = 1150;
      noise.connect(filter).connect(master);
      noise.start(now);
      noise.stop(now + duration);
    }

    function createBeads() {
      abacus.querySelectorAll(".bead").forEach(b => b.remove());
      beads.length = 0;

      columns.forEach((col, colIndex) => {
        createBead({ colIndex, type: "upper", lowerIndex: null });
        for (let i = 0; i < 4; i++) {
          createBead({ colIndex, type: "lower", lowerIndex: i });
        }
      });

      syncBeadPositions();
      updateNumber();
    }

    function createBead(data) {
      const img = document.createElement("img");
      img.src = "assets/bead.png";
      img.alt = "";
      img.className = "bead";
      img.draggable = false;
      img.dataset.col = data.colIndex;
      img.dataset.type = data.type;
      img.dataset.lowerIndex = data.lowerIndex ?? "";

      img.addEventListener("pointerdown", onPointerDown);
      beads.push(img);
      abacus.appendChild(img);
    }

    function syncBeadPositions() {
      beads.forEach(bead => {
        const colIndex = Number(bead.dataset.col);
        const type = bead.dataset.type;
        const col = columns[colIndex];

        bead.style.left = col.x + "%";

        if (type === "upper") {
          bead.style.top = (col.upper ? upperY.active : upperY.inactive) + "%";
        } else {
          const i = Number(bead.dataset.lowerIndex);
          bead.style.top = (i < col.lower ? lowerActiveY[i] : lowerInactiveY[i]) + "%";
        }
      });
    }

    function settleColumn(colIndex) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      beads.filter(bead => Number(bead.dataset.col) === colIndex).forEach(bead => {
        bead.classList.remove("is-settling");
        void bead.offsetWidth;
        bead.classList.add("is-settling");
        bead.addEventListener("animationend", () => bead.classList.remove("is-settling"), { once: true });
      });
    }

    function setColumnHighlight(colIndex) {
      rodLabels.forEach((label, index) => label.classList.toggle("is-active", index === colIndex));
      rodFocuses.forEach((focus, index) => focus.classList.toggle("is-active", index === colIndex));
    }

    function highlightColumn(colIndex, duration = 0) {
      const token = ++activeColumnToken;
      setColumnHighlight(colIndex);
      if (duration > 0) {
        setTimeout(() => {
          if (token === activeColumnToken) setColumnHighlight(null);
        }, duration);
      }
    }

    function clearActiveColumn(delay = 0) {
      const token = ++activeColumnToken;
      const clear = () => {
        if (token === activeColumnToken) setColumnHighlight(null);
      };
      if (delay > 0) setTimeout(clear, delay);
      else clear();
    }

    function onPointerDown(e) {
      if (controlsLocked) return;
      const bead = e.currentTarget;
      playBeadClick(.8, true);
      bead.setPointerCapture(e.pointerId);
      bead.classList.add("is-dragging");
      highlightColumn(Number(bead.dataset.col));

      dragging = {
        bead,
        rect: abacus.getBoundingClientRect()
      };

      bead.addEventListener("pointermove", onPointerMove);
      bead.addEventListener("pointerup", onPointerUp);
      bead.addEventListener("pointercancel", onPointerUp);
    }

    function onPointerMove(e) {
      if (!dragging) return;

      const bead = dragging.bead;
      const rect = dragging.rect;
      const colIndex = Number(bead.dataset.col);
      const type = bead.dataset.type;
      const col = columns[colIndex];
      const beforeDigit = (col.upper ? 5 : 0) + col.lower;
      const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

      if (type === "upper") {
        const threshold = (upperY.inactive + upperY.active) / 2;
        col.upper = yPercent > threshold;
      } else {
        const i = Number(bead.dataset.lowerIndex);
        const threshold = (lowerActiveY[i] + lowerInactiveY[i]) / 2;

        // Dragging the 2nd / 3rd / 4th lower bead moves the beads above together
        if (yPercent < threshold) {
          col.lower = i + 1;
        } else {
          col.lower = i;
        }
      }

      const afterDigit = (col.upper ? 5 : 0) + col.lower;
      if (afterDigit !== beforeDigit) {
        playBeadClick();
        settleColumn(colIndex);
        highlightColumn(colIndex);
      }

      syncBeadPositions();
      clearInputError();
      hideAnswer();
      updateNumber();
    }

    function onPointerUp() {
      if (!dragging) return;

      const bead = dragging.bead;
      const colIndex = Number(bead.dataset.col);
      bead.removeEventListener("pointermove", onPointerMove);
      bead.removeEventListener("pointerup", onPointerUp);
      bead.removeEventListener("pointercancel", onPointerUp);
      bead.classList.remove("is-dragging");
      dragging = null;

      syncBeadPositions();
      settleColumn(colIndex);
      highlightColumn(colIndex, 230);
      updateNumber();
    }

    function getTotal() {
      let total = 0;

      columns.forEach(col => {
        const digit = (col.upper ? 5 : 0) + col.lower;
        total += digit * col.place;
      });

      return total;
    }

    function updateNumber() {
      const total = getTotal();
      numberDisplay.textContent = total.toString();
      wordDisplay.textContent = languageData[currentLang].words(total);

      numberDisplay.classList.toggle("hidden", !answerVisible);
      wordDisplay.classList.toggle("hidden", !answerVisible);
      speakBtn.disabled = !answerVisible;
    }

    function showAnswer() {
      answerVisible = true;
      updateNumber();
    }

    function hideAnswer() {
      answerVisible = false;
      numberDisplay.classList.add("hidden");
      wordDisplay.classList.add("hidden");
      speakBtn.disabled = true;
    }

    async function resetAbacus() {
      const token = ++beadSequenceToken;
      stopMalayAudio();
      hideAnswer();
      clearInputError();
      keyNumberInput.value = "";
      setControlsLocked(true);

      try {
        for (const colIndex of [3, 2, 1, 0]) {
          if (token !== beadSequenceToken) return;
          if (getColumnDigit(colIndex) === 0) continue;

          setColumnDigit(colIndex, 0);
          syncBeadPositions();
          settleColumn(colIndex);
          highlightColumn(colIndex, 220);
          playBeadClick(.9, true);
          updateNumber();
          await wait(125);
        }
      } finally {
        if (token === beadSequenceToken) {
          setControlsLocked(false);
          clearActiveColumn(180);
          updateNumber();
        }
      }
    }

    function numberToEnglish(n) {
      const ones = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
                    "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen",
                    "seventeen", "eighteen", "nineteen"];
      const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

      function under100(num) {
        if (num < 20) return ones[num];
        const t = Math.floor(num / 10);
        const o = num % 10;
        return tens[t] + (o ? " " + ones[o] : "");
      }

      function under1000(num) {
        if (num < 100) return under100(num);
        const h = Math.floor(num / 100);
        const rest = num % 100;
        return ones[h] + " hundred" + (rest ? " " + under100(rest) : "");
      }

      if (n === 0) return "zero";
      if (n < 1000) return under1000(n);

      const th = Math.floor(n / 1000);
      const rest = n % 1000;
      return ones[th] + " thousand" + (rest ? " " + under1000(rest) : "");
    }

    function numberToMalay(n) {
      if (n === 0) return "sifar";

      const ones = ["sifar", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "lapan", "sembilan"];

      function under100(num) {
        if (num < 10) return ones[num];
        if (num === 10) return "sepuluh";
        if (num === 11) return "sebelas";
        if (num < 20) return ones[num - 10] + " belas";

        const puluh = Math.floor(num / 10);
        const sa = num % 10;
        return ones[puluh] + " puluh" + (sa ? " " + ones[sa] : "");
      }

      function under1000(num) {
        if (num < 100) return under100(num);

        const ratus = Math.floor(num / 100);
        const baki = num % 100;

        // Place-value teaching style:
        // 100 = satu ratus, not seratus
        let text = ones[ratus] + " ratus";
        if (baki > 0) text += " " + under100(baki);
        return text;
      }

      function underMillion(num) {
        if (num < 1000) return under1000(num);

        const ribu = Math.floor(num / 1000);
        const baki = num % 1000;

        // Place-value teaching style:
        // 1000 = satu ribu, not seribu
        let text = under1000(ribu) + " ribu";
        if (baki > 0) text += " " + under1000(baki);
        return text;
      }

      if (n < 1000000) return underMillion(n);

      const juta = Math.floor(n / 1000000);
      const baki = n % 1000000;

      // Place-value teaching style:
      // 1000000 = satu juta, not sejuta
      let text = underMillion(juta) + " juta";
      if (baki > 0) text += " " + underMillion(baki);
      return text;
    }

    function numberToChinese(n) {
      const digit = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

      if (n === 0) return "零";

      const thousands = Math.floor(n / 1000);
      const hundreds = Math.floor((n % 1000) / 100);
      const tens = Math.floor((n % 100) / 10);
      const ones = n % 10;

      let text = "";

      if (thousands > 0) {
        text += digit[thousands] + "千";
      }

      if (hundreds > 0) {
        text += digit[hundreds] + "百";
      } else if (thousands > 0 && (tens > 0 || ones > 0)) {
        text += "零";
      }

      if (tens > 0) {
        if (tens === 1 && thousands === 0 && hundreds === 0) {
          text += "十";
        } else {
          text += digit[tens] + "十";
        }
      } else if ((thousands > 0 || hundreds > 0) && ones > 0) {
        if (!text.endsWith("零")) text += "零";
      }

      if (ones > 0) {
        text += digit[ones];
      }

      return text;
    }

    resetBtn.addEventListener("click", resetAbacus);
    answerBtn.addEventListener("click", showAnswer);

    // Preload common BM audio files so phone playback feels faster after the page opens.
    const bmCommonAudioWords = [
      "sifar", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "lapan", "sembilan",
      "sepuluh", "sebelas", "belas", "puluh", "ratus", "ribu"
    ];
    const bmAudioUrlCache = new Map();
    let bmPreloadStarted = false;

    function preloadMalayAudio() {
      if (bmPreloadStarted) return;
      bmPreloadStarted = true;

      bmCommonAudioWords.forEach(word => {
        const src = `assets/audio/bm/${word}.MP3`;
        const audio = new Audio();
        audio.preload = "auto";
        audio.src = src;
        audio.load();
        bmAudioUrlCache.set(word, src);
      });
    }

    // Android / iPhone usually allows better loading after first touch.
    window.addEventListener("load", () => {
      setTimeout(preloadMalayAudio, 300);
    }, { once: true });

    document.addEventListener("pointerdown", event => {
      // Important:
      // If the first tap is the speaker button, speak immediately.
      // Do not start bulk preload on the same tap, because some phones will delay/block playback.
      if (event.target.closest("#speakBtn")) return;

      preloadMalayAudio();
    }, { once: true });

    speakBtn.addEventListener("click", speakCurrentAnswer);

    async function speakCurrentAnswer() {
      // Do not reveal or read the answer before the Answer button is pressed.
      // Students must press Answer / 答案 / Jawapan first.
      if (!answerVisible) return;

      const total = getTotal();
      const text = languageData[currentLang].words(total);
      if (!text) return;

      // BM uses your own Malaysia Malay MP3 files for accurate pronunciation.
      if (currentLang === "bm") {
        window.speechSynthesis?.cancel();
        await playMalayMp3Sequence(text);
        return;
      }

      // EN and ZH still use browser TTS.
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = languageData[currentLang].speechLang;
      utterance.voice = getPreferredVoice(currentLang);

      if (currentLang === "zh") {
        utterance.rate = 0.85;
        utterance.pitch = 1.05;
      } else {
        // EN voice tuning only.
        // Slower and softer than before, so it sounds less robotic.
        utterance.rate = 0.88;
        utterance.pitch = 1.05;
      }

      window.speechSynthesis.speak(utterance);
    }

    function stopMalayAudio() {
      bmAudioToken++;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      window.speechSynthesis?.cancel();
    }

    let currentAudio = null;
    let bmAudioToken = 0;

    async function playMalayMp3Sequence(text) {
      bmAudioToken++;
      const token = bmAudioToken;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const chunks = makeMalayAudioChunks(text);

      for (const chunk of chunks) {
        if (token !== bmAudioToken) return;
        await playMalayChunkMp3(chunk, token);
        await wait(0);
      }
    }

    function makeMalayAudioChunks(text) {
      const rawWords = text.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const chunks = [];

      for (const word of rawWords) {
        // Keep compatibility if old wording ever appears.
        if (word === "seratus") {
          chunks.push("satu", "ratus");
          continue;
        }
        if (word === "seribu") {
          chunks.push("satu", "ribu");
          continue;
        }
        if (word === "sejuta") {
          chunks.push("satu", "juta");
          continue;
        }

        // For 12-19, play as separate chunks:
        // dua + belas, tiga + belas, etc.
        // This is faster than trying many phrase filenames first.
        chunks.push(word);
      }

      return chunks;
    }

    async function playMalayChunkMp3(chunk, token) {
      // First try a phrase file for 12-19, e.g.:
      // dua belas.MP3 / dua_belas.MP3 / dua-belas.MP3 / duabelas.MP3
      const phraseOk = await playMalayFileMp3(chunk, token, true);
      if (phraseOk) return true;

      // If phrase file is missing, fall back to separate word files:
      // dua.MP3 + belas.MP3
      if (chunk.includes(" ")) {
        let anyOk = false;
        const parts = chunk.split(/\s+/).filter(Boolean);
        for (const part of parts) {
          if (token !== bmAudioToken) return false;
          const ok = await playMalayFileMp3(part, token, false);
          anyOk = anyOk || ok;
          await wait(0);
        }
        return anyOk;
      }

      return false;
    }

    async function playMalayFileMp3(name, token, allowPhraseVariants) {
      const forms = makeMalayFileNameVariants(name, allowPhraseVariants);
      const extensions = [".MP3", ".mp3", ".Mp3"];

      for (const form of forms) {
        for (const ext of extensions) {
          const src = `assets/audio/bm/${form}${ext}`;

          // If this word already worked before, try that exact URL first next time.
          if (bmAudioUrlCache.get(name) === src) {
            const ok = await playOneMp3(src, token);
            if (ok) return true;
          }

          const ok = await playOneMp3(src, token);
          if (ok) {
            bmAudioUrlCache.set(name, src);
            return true;
          }
        }
      }

      console.warn("Missing BM audio file:", name);
      return false;
    }

    function makeMalayFileNameVariants(name, allowPhraseVariants) {
      const clean = name.trim().toLowerCase().replace(/\s+/g, " ");
      const variants = [clean];

      if (allowPhraseVariants && clean.includes(" ")) {
        variants.push(
          clean.replace(/\s+/g, "_"),
          clean.replace(/\s+/g, "-"),
          clean.replace(/\s+/g, "")
        );
      }

      return [...new Set(variants)];
    }

    function playOneMp3(src, token) {
      return new Promise(resolve => {
        if (token !== bmAudioToken) return resolve(false);

        const audio = new Audio(src);
        currentAudio = audio;

        // Faster BM MP3 playback for mobile.
        audio.playbackRate = 1.18;

        audio.onended = () => resolve(true);
        audio.onerror = () => resolve(false);

        audio.play().catch(err => {
          console.warn("Audio play blocked or failed:", err);
          resolve(false);
        });
      });
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function getPreferredVoice(lang) {
      const voices = window.speechSynthesis.getVoices();

      const femaleKeywords = [
        "female", "woman", "girl",
        "zira", "aria", "jenny", "samantha", "victoria", "susan",
        "karen", "moira", "tessa", "siti", "yasmin", "ayu"
      ];

      function soundsFemale(voice) {
        const name = voice.name.toLowerCase();
        return femaleKeywords.some(keyword => name.includes(keyword));
      }

      function byLang(code) {
        return voices.filter(v => v.lang.toLowerCase() === code.toLowerCase());
      }

      function byLangPrefix(prefix) {
        return voices.filter(v => v.lang.toLowerCase().startsWith(prefix.toLowerCase()));
      }

      function chooseFemale(list) {
        return list.find(soundsFemale) || list[0] || null;
      }

      if (lang === "bm") {
        // Best: exact Malaysia Malay voice
        let list = byLang("ms-MY");
        let voice = chooseFemale(list);
        if (voice) return voice;

        // Next: any Malay voice
        list = byLangPrefix("ms");
        voice = chooseFemale(list);
        if (voice) return voice;

        // Some systems label Malay strangely. Try name search.
        list = voices.filter(v => {
          const name = v.name.toLowerCase();
          const code = v.lang.toLowerCase();
          return name.includes("malay") || name.includes("malaysia") || code.includes("ms");
        });
        voice = chooseFemale(list);
        if (voice) return voice;
      }

      if (lang === "en") {
        // Prefer common female English voices
        let list = byLang("en-US").concat(byLang("en-GB")).concat(byLangPrefix("en"));
        let voice = chooseFemale(list);
        if (voice) return voice;
      }

      if (lang === "zh") {
        let list = byLang("zh-CN")
          .concat(byLang("zh-TW"))
          .concat(byLang("zh-HK"))
          .concat(byLangPrefix("zh"));
        return list[0] || null;
      }

      return null;
    }

    // Some browsers load voices after page load.
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
